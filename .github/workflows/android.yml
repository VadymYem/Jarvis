name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Accept Android SDK licenses
        run: |
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Restore stable test signing key
        run: base64 --decode signing/jarvis-debug.jks.b64 > signing/jarvis-debug.jks

      - name: Verify native agent
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
