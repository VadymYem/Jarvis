name: Clean old workflow runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-runs.yml'
      - '.github/scripts/prune-workflow-runs.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Keep only three newest workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-workflow-runs.sh
