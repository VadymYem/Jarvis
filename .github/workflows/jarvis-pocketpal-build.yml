name: Jarvis PocketPal Android

on:
  push:
    branches: [main]
    paths:
      - 'pocketpal/**'
      - '.github/workflows/jarvis-pocketpal-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jarvis-pocketpal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'false'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - name: Checkout private Jarvis repository
        uses: actions/checkout@v7

      - name: Reconstruct PocketPal fork
        run: |
          git clone --filter=blob:none https://github.com/a-ghorbani/pocketpal-ai.git jarvis-src
          cd jarvis-src
          git checkout 4ebab32771df7d9e2554cd88a376bbda7d833da1
          git apply --check ../pocketpal/jarvis-pocketpal.patch
          git apply ../pocketpal/jarvis-pocketpal.patch
          git apply --check ../pocketpal/jarvis-live.patch
          git apply ../pocketpal/jarvis-live.patch
          git apply --check ../pocketpal/jarvis-agent-core-v0.3.patch
          git apply ../pocketpal/jarvis-agent-core-v0.3.patch
          git apply --check ../pocketpal/jarvis-neural-live-v0.3.patch
          git apply ../pocketpal/jarvis-neural-live-v0.3.patch
          git apply --check ../pocketpal/jarvis-device-search-v0.3.patch
          git apply ../pocketpal/jarvis-device-search-v0.3.patch
          git apply --check ../pocketpal/jarvis-migration-v0.3.patch
          git apply ../pocketpal/jarvis-migration-v0.3.patch
          git apply --check ../pocketpal/jarvis-ci-fixes.patch
          git apply ../pocketpal/jarvis-ci-fixes.patch
          git apply --check ../pocketpal/jarvis-agent-screen-v0.4.patch
          git apply ../pocketpal/jarvis-agent-screen-v0.4.patch
          git apply --check ../pocketpal/jarvis-agent-usability-v0.5.patch
          git apply ../pocketpal/jarvis-agent-usability-v0.5.patch
          git apply --check ../pocketpal/jarvis-screen-v0.6.patch
          git apply ../pocketpal/jarvis-screen-v0.6.patch
          git apply --check ../pocketpal/jarvis-knowledge-v0.7.patch
          git apply ../pocketpal/jarvis-knowledge-v0.7.patch
          git apply --check ../pocketpal/jarvis-knowledge-ci-fixes.patch
          git apply ../pocketpal/jarvis-knowledge-ci-fixes.patch
          git apply --check ../pocketpal/jarvis-knowledge-reader-fix.patch
          git apply ../pocketpal/jarvis-knowledge-reader-fix.patch
          git apply --check ../pocketpal/jarvis-files-python-v0.8.patch
          git apply ../pocketpal/jarvis-files-python-v0.8.patch
          git apply --check ../pocketpal/jarvis-agent-artifacts-v0.9.patch
          git apply ../pocketpal/jarvis-agent-artifacts-v0.9.patch
          git apply --check ../pocketpal/jarvis-remove-screen-module.patch
          git apply ../pocketpal/jarvis-remove-screen-module.patch
          gzip -dc ../pocketpal/jarvis-capabilities-v0.10.patch.gz > "$RUNNER_TEMP/jarvis-capabilities-v0.10.patch"
          git apply --check "$RUNNER_TEMP/jarvis-capabilities-v0.10.patch"
          git apply "$RUNNER_TEMP/jarvis-capabilities-v0.10.patch"
          git apply --check ../pocketpal/jarvis-v0.10-ci-fixes.patch
          git apply ../pocketpal/jarvis-v0.10-ci-fixes.patch
          git apply --check ../pocketpal/jarvis-v0.10-message-tests.patch
          git apply ../pocketpal/jarvis-v0.10-message-tests.patch
          git apply --check ../pocketpal/jarvis-delivery-v0.11.patch
          git apply ../pocketpal/jarvis-delivery-v0.11.patch
          python3 ../pocketpal/apply_jarvis_runtime_v0_12.py
          python3 ../pocketpal/apply_jarvis_runtime_v0_13.py
          git apply --check ../pocketpal/jarvis-reliability-v0.15.patch
          git apply ../pocketpal/jarvis-reliability-v0.15.patch
          git apply --check ../pocketpal/jarvis-work-v0.16.patch
          git apply ../pocketpal/jarvis-work-v0.16.patch
          git diff --check

      - name: Verify Jarvis Python artifact API
        working-directory: jarvis-src
        run: |
          PYTHONPATH=android/app/src/main/python python3 - <<'PY'
          import jarvis_artifacts
          assert callable(jarvis_artifacts.create_image)
          assert callable(jarvis_artifacts.create_card)
          assert callable(jarvis_artifacts.create_pdf)
          assert callable(jarvis_artifacts.create_doc)
          assert callable(jarvis_artifacts.create_docx)
          print("jarvis_artifacts API OK")
          PY

      - name: Verify real Python artifacts and document round trips
        run: |
          python3 -m venv "$RUNNER_TEMP/python-verify"
          "$RUNNER_TEMP/python-verify/bin/pip" install --disable-pip-version-check Pillow==11.0.0 pypdf==5.9.0
          "$RUNNER_TEMP/python-verify/bin/python" pocketpal/verify_python_runtime.py jarvis-src -v

      - name: Add Jarvis badge to launcher artwork
        run: |
          python3 -m venv "$RUNNER_TEMP/icon-venv"
          "$RUNNER_TEMP/icon-venv/bin/pip" install --disable-pip-version-check Pillow==11.3.0
          "$RUNNER_TEMP/icon-venv/bin/python" pocketpal/brand_launcher.py jarvis-src

      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: jarvis-src/.nvmrc
          cache: yarn
          cache-dependency-path: jarvis-src/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies and prebuilt llama libraries
        working-directory: jarvis-src
        run: yarn install --frozen-lockfile --network-timeout 30000

      - name: Format reconstructed Jarvis sources
        working-directory: jarvis-src
        run: yarn eslint . --fix

      - name: Validate localizations
        working-directory: jarvis-src
        run: yarn l10n:validate

      - name: Type-check
        working-directory: jarvis-src
        run: yarn typecheck

      - name: Lint
        working-directory: jarvis-src
        run: yarn lint

      - name: Unit tests
        working-directory: jarvis-src
        run: yarn test --runInBand --silent

      - name: Build signed arm64 APK
        working-directory: jarvis-src/android
        run: ./gradlew --no-daemon assembleProdRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify Android payload
        working-directory: jarvis-src
        run: |
          jq '.abis |= map(select(.abi == "arm64-v8a"))' \
            scripts/android-payload-manifest.json \
            > "$RUNNER_TEMP/android-payload-arm64.json"
          node scripts/verify-android-payload.js \
            --manifest "$RUNNER_TEMP/android-payload-arm64.json" \
            --apk android/app/build/outputs/apk/prod/release/app-prod-release.apk \
            --report payload-report.txt

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          apk=jarvis-src/android/app/build/outputs/apk/prod/release/app-prod-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -n "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -Fqi 'certificate SHA-256 digest: 3049195e638c8ac9b2c41be1981b895c09d6e482d4dc03fa6bb41a59f1b16efd' "$RUNNER_TEMP/apk-signature.txt"
          "$aapt" dump badging "$apk" | grep -q "package: name='top.authorche.agent' versionCode='16' versionName='0.16.0'"
          sha256sum "$apk"
          du -h "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-authorai-0.16.0-pocketpal-arm64-apk
          retention-days: 30
          if-no-files-found: error
          path: jarvis-src/android/app/build/outputs/apk/prod/release/app-prod-release.apk

      - name: Publish device-test prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/Jarvis-AuthorAI-0.16.0-pocketpal-arm64.apk"
          cp jarvis-src/android/app/build/outputs/apk/prod/release/app-prod-release.apk "$asset"
          if gh release view v0.16.0-pocketpal >/dev/null 2>&1; then
            gh release upload v0.16.0-pocketpal "$asset" --clobber
            gh release edit v0.16.0-pocketpal --notes-file pocketpal/RELEASE_NOTES.md
          else
            gh release create v0.16.0-pocketpal "$asset" \
              --target "$GITHUB_SHA" \
              --title "Jarvis | AuthorAi 0.16.0" \
              --notes-file pocketpal/RELEASE_NOTES.md --prerelease
          fi

      - name: Keep only the three newest workflow runs
        if: always()
        # GitHub can leave Dependabot dynamic runs queued and undeletable.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/prune-workflow-runs.sh
