name: Jarvis PocketPal Android

on:
  push:
    branches: [pocketpal-fork]
    paths:
      - 'pocketpal-fork/**'
      - '.github/workflows/jarvis-pocketpal-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-pocketpal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - name: Checkout private Jarvis repository
        uses: actions/checkout@v4

      - name: Reconstruct PocketPal fork
        run: |
          git clone --filter=blob:none https://github.com/a-ghorbani/pocketpal-ai.git jarvis-src
          cd jarvis-src
          git checkout 4ebab32771df7d9e2554cd88a376bbda7d833da1
          git apply --check ../pocketpal-fork/jarvis-pocketpal.patch
          git apply ../pocketpal-fork/jarvis-pocketpal.patch
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: jarvis-src/.nvmrc
          cache: yarn
          cache-dependency-path: jarvis-src/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        working-directory: jarvis-src
        run: yarn install --frozen-lockfile --network-timeout 30000

      - name: Validate localizations
        working-directory: jarvis-src
        run: yarn l10n:validate

      - name: Type-check
        working-directory: jarvis-src
        run: yarn typecheck

      - name: Lint
        working-directory: jarvis-src
        run: yarn lint

      - name: Unit tests
        working-directory: jarvis-src
        run: yarn test --runInBand --silent

      - name: Build signed arm64 APK and AAB
        working-directory: jarvis-src/android
        run: ./gradlew assembleProdRelease bundleProdRelease -PreactNativeArchitectures=arm64-v8a --build-cache

      - name: Verify release certificate
        run: |
          keytool -list -v             -keystore jarvis-src/android/app/jarvis-authorai-release.keystore             -storepass JvA_2026_release_9aT7xQ2mK8pL4wNc             -alias jarvis_authorai_release | grep 'SHA256:'

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-authorai-arm64
          retention-days: 7
          if-no-files-found: error
          path: |
            jarvis-src/android/app/build/outputs/apk/prod/release/*.apk
            jarvis-src/android/app/build/outputs/bundle/prodRelease/*.aab
