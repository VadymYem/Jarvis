name: Consolidate repository branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete auxiliary branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/jarvis-voice-mode"
            "pocketpal-fork"
            "dependabot/github_actions/actions/checkout-7"
            "dependabot/github_actions/actions/setup-java-6"
            "dependabot/github_actions/gradle/actions-5"
            "dependabot/gradle/androidx.core-core-ktx-1.19.1"
            "dependabot/gradle/com.android.application-9.4.1"
            "dependabot/gradle/org.jetbrains.kotlin.android-2.4.20"
            "dependabot/gradle/org.jetbrains.kotlin.plugin.compose-2.4.20"
            "dependabot/gradle/org.json-json-20260814"
          )
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch" || true
          done
